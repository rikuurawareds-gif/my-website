<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 428" role="img"><title>運用が重めの広告主の一例で、月80時間の作業ごとの内訳。上位7つの作業で全体の約7割</title><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0"><stop offset="0" stop-color="#3366ff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,sans-serif"><text x="196" y="33" font-size="14" font-weight="700" fill="#0f1424" text-anchor="end">ASP担当者とのやり取り</text><rect x="206" y="21" width="255" height="16" rx="4" fill="url(#g)"/><text x="469" y="34" font-size="14" font-weight="700" fill="#0f1424" text-anchor="start">15時間</text><text x="196" y="65" font-size="14" font-weight="700" fill="#0f1424" text-anchor="end">成果の承認・否認の判定</text><rect x="206" y="53" width="170" height="16" rx="4" fill="url(#g)"/><text x="384" y="66" font-size="14" font-weight="700" fill="#0f1424" text-anchor="start">10時間</text><text x="196" y="97" font-size="14" font-weight="700" fill="#0f1424" text-anchor="end">広告素材・LPの準備</text><rect x="206" y="85" width="170" height="16" rx="4" fill="url(#g)"/><text x="384" y="98" font-size="14" font-weight="700" fill="#0f1424" text-anchor="start">10時間</text><text x="196" y="129" font-size="14" font-weight="700" fill="#0f1424" text-anchor="end">媒体ごとの効果分析</text><rect x="206" y="117" width="102" height="16" rx="4" fill="url(#g)"/><text x="316" y="130" font-size="14" font-weight="700" fill="#0f1424" text-anchor="start">6時間</text><text x="196" y="161" font-size="14" font-weight="700" fill="#0f1424" text-anchor="end">社内報告</text><rect x="206" y="149" width="102" height="16" rx="4" fill="url(#g)"/><text x="316" y="162" font-size="14" font-weight="700" fill="#0f1424" text-anchor="start">6時間</text><text x="196" y="193" font-size="14" font-weight="700" fill="#0f1424" text-anchor="end">新規メディア・ASPの開拓</text><rect x="206" y="181" width="85" height="16" rx="4" fill="url(#g)"/><text x="299" y="194" font-size="14" font-weight="700" fill="#0f1424" text-anchor="start">5時間</text><text x="196" y="225" font-size="14" font-weight="700" fill="#0f1424" text-anchor="end">新規提携の手続き</text><rect x="206" y="213" width="85" height="16" rx="4" fill="url(#g)"/><text x="299" y="226" font-size="14" font-weight="700" fill="#0f1424" text-anchor="start">5時間</text><text x="196" y="257" font-size="14" font-weight="400" fill="#5b6378" text-anchor="end">掲載記事の表記の確認</text><rect x="206" y="245" width="68" height="16" rx="4" fill="#9aa4bf"/><text x="282" y="258" font-size="14" font-weight="400" fill="#5b6378" text-anchor="start">4時間</text><text x="196" y="289" font-size="14" font-weight="400" fill="#5b6378" text-anchor="end">請求・予算・着地見込み</text><rect x="206" y="277" width="68" height="16" rx="4" fill="#9aa4bf"/><text x="282" y="290" font-size="14" font-weight="400" fill="#5b6378" text-anchor="start">4時間</text><text x="196" y="321" font-size="14" font-weight="400" fill="#5b6378" text-anchor="end">単価・特単の交渉</text><rect x="206" y="309" width="51" height="16" rx="4" fill="#9aa4bf"/><text x="265" y="322" font-size="14" font-weight="400" fill="#5b6378" text-anchor="start">3時間</text><text x="196" y="353" font-size="14" font-weight="400" fill="#5b6378" text-anchor="end">その他</text><rect x="206" y="341" width="204" height="16" rx="4" fill="#9aa4bf"/><text x="418" y="354" font-size="14" font-weight="400" fill="#5b6378" text-anchor="start">12時間</text><rect x="206" y="378" width="18" height="12" rx="3" fill="url(#g)"/><text x="230" y="389" font-size="14" font-weight="700" fill="#0f1424" text-anchor="start">上位7つの作業（計57時間・約7割）</text><rect x="206" y="402" width="18" height="12" rx="3" fill="#9aa4bf"/><text x="230" y="413" font-size="14" font-weight="400" fill="#5b6378" text-anchor="start">そのほかの作業（計23時間）</text></g></svg>
