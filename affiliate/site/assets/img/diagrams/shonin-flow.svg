<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img"><title>成果承認の流れ。ASPの成果一覧と自社の注文データを突き合わせ、承認・否認・要確認に分け、管理画面に反映し、問い合わせに答える。ASPの数だけくり返す</title><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0"><stop offset="0" stop-color="#3366ff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><g font-family="Noto Sans JP,Hiragino Kaku Gothic ProN,sans-serif"><rect x="20" y="10" width="230" height="58" rx="10" fill="#f4f6fb" stroke="#e4e7ef" stroke-width="1.5" /><text x="135" y="36" font-size="15" font-weight="700" fill="#0f1424" text-anchor="middle">ASPの成果一覧（CSV）</text><text x="135" y="56" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">承認待ちの成果</text><rect x="310" y="10" width="230" height="58" rx="10" fill="#f4f6fb" stroke="#e4e7ef" stroke-width="1.5" /><text x="425" y="36" font-size="15" font-weight="700" fill="#0f1424" text-anchor="middle">自社の注文・申込データ</text><text x="425" y="56" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">注文番号・申込ID</text><path d="M135 68C135 96 280 86 280 110M425 68C425 96 280 86 280 110" stroke="#9aa4bf" stroke-width="2" fill="none"/><rect x="150" y="110" width="260" height="50" rx="10" fill="#fff" stroke="#0f1424" stroke-width="1.5" /><text x="280" y="141" font-size="16" font-weight="700" fill="#0f1424" text-anchor="middle">突き合わせて、基準で判定</text><path d="M280 160V176M120 176H440M120 176V190M280 176V190M440 176V190" stroke="#9aa4bf" stroke-width="2" fill="none"/><rect x="50" y="190" width="140" height="44" rx="10" fill="#eef3ff" stroke="#3366ff" stroke-width="1.5" /><text x="120" y="218" font-size="16" font-weight="900" fill="#3366ff" text-anchor="middle">承認</text><rect x="210" y="190" width="140" height="44" rx="10" fill="#fff6ea" stroke="#b54708" stroke-width="1.5" /><text x="280" y="218" font-size="16" font-weight="900" fill="#b54708" text-anchor="middle">否認</text><rect x="370" y="190" width="140" height="44" rx="10" fill="#fff" stroke="#9aa4bf" stroke-width="1.5" stroke-dasharray="5 4"/><text x="440" y="212" font-size="15" font-weight="700" fill="#0f1424" text-anchor="middle">要確認</text><text x="440" y="228" font-size="12" font-weight="400" fill="#5b6378" text-anchor="middle">人が判断</text><path d="M120 234V250H440V234M280 234V250" stroke="#9aa4bf" stroke-width="2" fill="none"/><path d="M280 250V268" stroke="#9aa4bf" stroke-width="2" fill="none"/><path d="M274 265L280 274L286 265" stroke="#9aa4bf" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="274" width="260" height="46" rx="10" fill="#fff" stroke="#0f1424" stroke-width="1.5" /><text x="280" y="302" font-size="16" font-weight="700" fill="#0f1424" text-anchor="middle">ASPの管理画面に反映</text><path d="M280 320V338" stroke="#9aa4bf" stroke-width="2" fill="none"/><path d="M274 335L280 344L286 335" stroke="#9aa4bf" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="344" width="260" height="46" rx="10" fill="#f4f6fb" stroke="#e4e7ef" stroke-width="1.5" /><text x="280" y="372" font-size="14" font-weight="400" fill="#0f1424" text-anchor="middle">メディアからの問い合わせに答える</text><path d="M150 297H10V39H14" stroke="#3366ff" stroke-width="2" fill="none" stroke-dasharray="5 5"/><path d="M12 33l7 6-7 6" stroke="#3366ff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="18" y="262" font-size="13" font-weight="700" fill="#3366ff" text-anchor="start">ASPの数だけくり返す</text></g></svg>
